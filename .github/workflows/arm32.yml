name: ARM32 Pull and Save Docker Image

on:
  workflow_dispatch:
    inputs:
      docker_images:
        description: '请填写 Docker 镜像名称，多个镜像用英文逗号分隔'
        required: true
        default: 'alpine:latest,ubuntu:latest'

jobs:
  pull_and_package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean up Docker to free space
        run: |
          docker system prune -a -f
          docker volume prune -f

      - name: Pull ARM32 Docker images and package
        env:
          DOCKER_IMAGES: ${{ github.event.inputs.docker_images }}
        run: |
          set -euo pipefail

          IFS=',' read -r -a raw_images <<< "$DOCKER_IMAGES"
          images=()

          for raw_image in "${raw_images[@]}"; do
            # Remove whitespace around each comma-separated image name.
            image="$(printf '%s' "$raw_image" | xargs)"
            if [[ -n "$image" ]]; then
              images+=("$image")
            fi
          done

          if [[ "${#images[@]}" -eq 0 ]]; then
            echo '未提供有效的 Docker 镜像名称。' >&2
            exit 1
          fi

          printf '%s\n' "${images[@]}" > images-summary.txt

          for image in "${images[@]}"; do
            docker pull --platform linux/arm/v7 "$image"
          done

          # Save all ARM32 images into one tar stream and gzip it directly.
          docker save "${images[@]}" | gzip -9 > docker-images-arm32.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-images-arm32-tar-file
          path: |
            docker-images-arm32.tar.gz
            images-summary.txt
          retention-days: 1

      - name: Clean up intermediate files
        run: |
          rm -f docker-images-arm32.tar.gz images-summary.txt
